    note: "RZ (8.2) T(x) = Int.fract x⁻¹; def line byte-identical to RiemannZeta.MatricesMobius.RZ.gaussMap (L:RZ-53a); used by L:MS-39; a definition with a body, not a hole"
  - name: "ModularSurface.Now.RZ.mayer"
    note: "RZ (8.3) ℒ_s f(x) = Σ_{n≥1} (x + n)^(−2s) f(1/(x + n)) as a tsum; definition byte-identical to RiemannZeta.MatricesMobius.RZ.mayer (L:RZ-53a); MS names the Mayer operator without printing its formula, V1 accepted the import; used by L:MS-39"
  - name: "ModularSurface.Now.ms02InvOrder"
    note: "1/r on ℕ∞ with the printed convention 1/∞ = 0 (L:MS-02)"
  - name: "ModularSurface.Now.ms02Area"
    note: "2π(1/6 − 1/r) as printed (L:MS-02)"
  - name: "ModularSurface.Now.ms02ChiOrb"
    note: "χ_orb(r) = 1/r − 1/6, the standard orbifold Euler characteristic of the (2,3,r) sphere orbifold, unprinted in the sentence (L:MS-02; V1: faithful)"
  - name: "ModularSurface.Now.ms02K"
    note: "k = 1/(2|χ_orb|) (L:MS-02)"
  - name: "ModularSurface.Now.ms03HeckeArea"
    note: "π − 2π/q, the standard (2,q,∞) Hecke-orbifold area, unprinted (the paper prints the four values) (L:MS-03; V1: accepted)"
  - name: "ModularSurface.Now.selbergNormOfTrace"
    note: "N_Γ = λ², λ = (t + √(t² − 4))/2, the standard Selberg normalisation, unprinted; none at the pin (L:MS-07; V1: the only one making (2.6) and the matching both hold)"
  - name: "ModularSurface.Now.ms13IsFundDisc"
    note: "positive fundamental discriminant (D ≡ 1 mod 4 squarefree, or 4m with m ≡ 2, 3 mod 4 squarefree); none at the pin (L:MS-13; shared with L:MS-32a)"
  - name: "ModularSurface.Now.ms14NegPellSet"
    note: "squarefree d > 1 with x² − dy² = −1 or −4 solvable over ℤ (L:MS-14a; shared with L:MS-14b, L:MS-14c)"
  - name: "ModularSurface.Now.ms32Gc"
    note: "g(d) = 1/(π√d), the certificate written form-independently (L:MS-32a; shared with L:MS-32b)"
  - name: "ModularSurface.Now.ms39HurwitzClassical"
    note: "the classical Hurwitz zeta Σ_{n≥0} (n + a)^(−σ); mathlib's HurwitzZeta.hurwitzZeta is 1-periodic in a and differs for a ∉ [0, 1] (L:MS-39; V1: confirmed)"
